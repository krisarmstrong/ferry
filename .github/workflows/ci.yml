name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts it on release-please's PR branch (see release.yml).
  workflow_dispatch:

permissions:
  contents: read

# A dispatched run on a release branch replaces the one before it on that branch, so a stale run
# cannot report over a newer one. Other runs get a group of their own: unchanged.
concurrency:
  group: >-
    ci-${{ github.event_name == 'workflow_dispatch' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # The runner image's newest Xcode. It has no Xcode 27 and there is no macos-27 image, so the
  # package declares swift-tools-version 6.3, the newest this Xcode reads.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  LIBMTP_VERSION: 1.1.23

jobs:
  check:
    runs-on: macos-26
    # A test that hangs fails the job here, not after GitHub's six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          test -d "$DEVELOPER_DIR" || { echo "::error::$DEVELOPER_DIR is not on this image"; exit 1; }
          xcodebuild -version
          swift --version
      - name: Install SwiftLint and XcodeGen
        run: |
          mkdir -p "$RUNNER_TEMP/tools/bin"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  swiftlint.zip" | shasum -a 256 -c
          unzip -q swiftlint.zip swiftlint -d bin
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  xcodegen.zip" | shasum -a 256 -c
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Install libmtp
        run: |
          brew install libmtp pkgconf
          installed="$(brew list --versions libmtp | awk '{print $2}')"
          [ "$installed" = "$LIBMTP_VERSION" ] \
            || { echo "::error::libmtp is $installed, CI expects $LIBMTP_VERSION"; exit 1; }
      - name: Lint, format check, test
        run: make lint fmt-check test
      - name: Build the app, ad hoc signed
        run: make app SIGN=adhoc
      # The release build as the release workflow makes it, on the same image and Xcode: pinned
      # libmtp and libusb, Release config, check-release (no get-task-allow, nothing from
      # Homebrew). Signed ad hoc and not notarized: CI holds no secrets.
      - name: Build the release, ad hoc signed, and check it
        run: make release SIGN=adhoc

  # Only runs from push, pull_request and a few other events count for a PR's required checks:
  # a workflow_dispatch run's `check` job passes on the head commit and still does not. Release
  # PRs need this, because release-please opens them with GITHUB_TOKEN, and their pull_request
  # run waits for someone with write access to approve it. So when release.yml dispatches this
  # workflow on a release branch, `pending` marks the tested commit as under way and `report`
  # records the result there, as a commit status `check` and as a check run `check` made
  # through the API. Both come from GitHub Actions, as branch protection requires; GitHub wants
  # a status and a check run of one name both to pass, so they always carry the same result.
  # A failed or cancelled run reports failure: re-run it (docs/RELEASING.md).
  pending:
    if: >-
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/heads/release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      statuses: write
      checks: write
    outputs:
      check-run: ${{ steps.mark.outputs.check-run }}
    steps:
      - name: Mark the commit as under test
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending \
            -f context=check -f description="CI on workflow_dispatch: running" \
            -f target_url="$url" > /dev/null
          id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name=check \
            -f head_sha="$GITHUB_SHA" -f status=in_progress -f details_url="$url" --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::no check run id: $id"; exit 1; }
          echo "check-run=$id" >> "$GITHUB_OUTPUT"

  report:
    needs: [pending, check]
    if: always() && needs.pending.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      statuses: write
      checks: write
    steps:
      - name: Report the result on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          CHECK_RUN: ${{ needs.pending.outputs.check-run }}
        run: |
          state=failure
          [ "$RESULT" = success ] && state=success
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" \
            -f context=check -f description="CI on workflow_dispatch: $RESULT" \
            -f target_url="$url" > /dev/null
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN" -f status=completed \
            -f conclusion="$state" -f details_url="$url" \
            -f "output[title]=CI on workflow_dispatch: $RESULT" \
            -f "output[summary]=The check job of $url: $RESULT." > /dev/null
