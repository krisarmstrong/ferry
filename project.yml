name: Ferry

options:
  bundleIdPrefix: io.github.krisarmstrong
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  Ferry:
    path: .

settings:
  base:
    # The team that signs Ferry. It also names the app group and the agent's Mach service, and
    # each bundle records it as FerryTeamID. Override with `make app TEAM=<your team ID>`.
    FERRY_TEAM_ID: X6JWYP43HG
    DEVELOPMENT_TEAM: $(FERRY_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Off for development: the agent loads Homebrew's libmtp, which library validation would
    # refuse. Plan 3 bundles libmtp and turns this on.
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Ferry:
    type: application
    platform: macOS
    sources:
      - path: Apps/Ferry
      # The app icon, an Icon Composer bundle that actool compiles to Ferry.icns and Assets.car.
      - path: Design/Icon/Ferry.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.krisarmstrong.ferry
        PRODUCT_NAME: Ferry
        INFOPLIST_FILE: Apps/Ferry/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Ferry/Ferry.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: Ferry
    postBuildScripts:
      # The agent's launchd plist, where SMAppService.agent(plistName:) looks for it, with the
      # team's Mach service name filled in. A copy phase would keep $(FERRY_TEAM_ID) verbatim.
      - name: Install the agent's launchd plist
        inputFiles:
          - $(SRCROOT)/Apps/FerryAgent/io.github.krisarmstrong.ferry.agent.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/io.github.krisarmstrong.ferry.agent.plist
        script: |
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          sed "s/[$](FERRY_TEAM_ID)/${FERRY_TEAM_ID}/g" "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
    dependencies:
      - package: Ferry
        product: FerryUI
      - package: Ferry
        product: FerryIPC
      - target: FerryAgent
        embed: true
        codeSign: false
        copy:
          destination: executables
      - target: FerryProvider
        embed: true
      - target: FerrySync
        embed: true

  FerryAgent:
    type: tool
    platform: macOS
    sources:
      - path: Apps/FerryAgent
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.krisarmstrong.ferry.agent
        PRODUCT_NAME: FerryAgent
        CODE_SIGN_ENTITLEMENTS: Apps/FerryAgent/FerryAgent.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: it adds FerryTeamID.
        INFOPLIST_FILE: Apps/FerryAgent/Info.plist
        # A tool has no bundle, so its Info.plist (and so its signing identifier) lives in the
        # binary.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: Ferry
        product: FerryAgentCore
      - package: Ferry
        product: FerryIPC
      - package: Ferry
        product: MTPTransport
      - package: Ferry
        product: ADBTransport
      - package: Ferry
        product: DeviceKit

  FerryProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/FerryProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.krisarmstrong.ferry.provider
        PRODUCT_NAME: FerryProvider
        INFOPLIST_FILE: Apps/FerryProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/FerryProvider/FerryProvider.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: Ferry
        product: FerryProviderCore
      - package: Ferry
        product: FerryIPC
      - package: Ferry
        product: DeviceKit

  # The Finder menu: Send to <device> and Install on <device>. Sandboxed; it talks only to the
  # agent, which admits it in its own role (see ClientRole.finderSync).
  FerrySync:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/FerrySync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.krisarmstrong.ferry.sync
        PRODUCT_NAME: FerrySync
        INFOPLIST_FILE: Apps/FerrySync/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/FerrySync/FerrySync.entitlements
        SKIP_INSTALL: YES
        # It loads no Homebrew library, and it may send files to devices and install apps, so
        # nothing may inject code into it. The other targets follow in Plan 3.
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Ferry
        product: FerrySyncCore
      - package: Ferry
        product: FerryIPC
      - sdk: FinderSync.framework

schemes:
  Ferry:
    build:
      targets:
        Ferry: all
